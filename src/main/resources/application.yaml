server:
  port: 8082

spring:
  application:
    name: snkrlab-ms-productos

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/snkrlab_products_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect